<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Intelligence | Revenue dashboard</title>
<p id="status">Loading the revenue dashboard…</p>
<script>
(async () => {
  try {
    const response = await fetch('./dashboard.html.gz', { cache: 'no-cache' });
    if (!response.ok || !response.body) throw new Error('Dashboard unavailable');
    const stream = response.body.pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    if (!html.startsWith('<!doctype html>')) throw new Error('Invalid dashboard');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById('status').textContent = 'The dashboard could not load. Reload this page to try again.';
    console.error(error);
  }
})();
</script>
</html>
